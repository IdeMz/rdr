name: run

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          TG_TOKEN_EJEMPLO: ${{ secrets.TG_TOKEN_EJEMPLO }}
          TG_CHAT_EJEMPLO: ${{ secrets.TG_CHAT_EJEMPLO }}
        run: python deals.py --all

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --staged --quiet || git commit -m "state"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
