name: run

on:
  schedule:
    - cron: '2-59/5 * * * *'
  repository_dispatch:
    types: [tick]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          TG_TOKEN_EJEMPLO: ${{ secrets.TG_TOKEN_EJEMPLO }}
          TG_CHAT_EJEMPLO: ${{ secrets.TG_CHAT_EJEMPLO }}
          TG_ALERT_CHAT: ${{ secrets.TG_ALERT_CHAT }}
        run: python deals.py --all

      - name: Informe de productos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe
          path: reports/
          retention-days: 3
          if-no-files-found: ignore

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --staged --quiet || git commit -m "state: $(head -n 1 run_note.txt 2>/dev/null || echo ejecucion)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
